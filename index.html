<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10222E" />
    <!-- PWA : « Ajouter à l'écran d'accueil » → app plein écran, autorisation caméra demandée une seule fois -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Qayed" />
    <title>Qayed — Enregistrez vos voyageurs en 30 secondes</title>
    <meta name="description" content="Qayed remplace la fiche de police papier. Scannez le passeport ou la CIN, les données sont extraites automatiquement, la fiche est prête, imprimable et envoyée par WhatsApp au destinataire configuré par l'établissement." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qayed" />
    <meta property="og:title" content="Qayed — Enregistrez vos voyageurs en 30 secondes" />
    <meta property="og:description" content="La fiche de police digitale pour hébergements tunisiens — scan MRZ du passeport et de la CIN, impression en un clic, envoi WhatsApp automatique." />
    <meta property="og:image" content="https://qayed.tn/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://qayed.tn" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Qayed — Enregistrez vos voyageurs en 30 secondes" />
    <meta name="twitter:description" content="La fiche de police digitale pour hébergements tunisiens." />
    <meta name="twitter:image" content="https://qayed.tn/og-image.png" />
    <link rel="canonical" href="https://qayed.tn" />
    <!-- Vérification du domaine Meta (Business Manager). Doit être dans le HTML
         servi, pas posée par le JavaScript : le robot de Meta ne rend pas la page. -->
    <meta name="facebook-domain-verification" content="ircm5vrzevs1wdl1ufrhczujfe55cq" />
    <!-- Éditeur du site, en donnée structurée. Servi DANS LE HTML et non posé
         par le JavaScript (comme le reste du JSON-LD, cf. src/cms/useSeoMeta.ts) :
         c'est la seule forme qu'un robot ou un examinateur qui n'exécute pas de
         script puisse lire. Copie manuelle de ORGANIZATION_LD
         (src/config/publisher.ts) — src/config/publisher.test.ts vérifie que les
         deux ne divergent pas. -->
    <script type="application/ld+json" data-publisher-ld>
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://qayed.tn/#organization",
        "name": "Qayed",
        "legalName": "SOCIETE UW AGENCY",
        "url": "https://qayed.tn",
        "logo": "https://qayed.tn/icon-512.png",
        "email": "contact@qayed.tn",
        "telephone": "+216 93 116 000",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "02 Rue Abdallah El Mahdi, Carthage Byrsa",
          "addressLocality": "Carthage",
          "postalCode": "2016",
          "addressCountry": "TN"
        }
      }
    </script>
    <!-- Polices auto-hébergées (voir src/styles/fonts.css) : on précharge les
         deux seuls sous-ensembles utilisés dès le premier écran. Les autres
         (latin-ext, arabe) restent à la charge de leur unicode-range. -->
    <link rel="preload" href="/fonts/archivo-400-900-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/plex-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Le contenu de la page vient de l'API sur une autre origine : ouvrir la
         connexion (DNS + TLS) pendant le chargement du bundle économise un
         aller-retour sur le chemin du premier rendu utile. -->
    <link rel="preconnect" href="https://checktunisia-backend-production.up.railway.app" crossorigin>
    <link rel="preconnect" href="https://api.qayed.tn" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
