name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gates bloquants : lint (rules-of-hooks, etc.), types et tests doivent passer.
      - name: Lint
        run: npm run lint

      # La dette de types a ete resorbee : verbatimModuleSyntax + 0 erreur tsc.
      # Cette etape est desormais bloquante pour empecher toute regression.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # Le build échoue sur des erreurs que lint et tsc ne voient pas (imports
      # cassés à la résolution, plugins Vite, budgets de chunk). Une PR qui ne
      # construit pas ne doit pas être mergeable.
      - name: Build
        run: npm run build

      # --omit=dev volontaire : les vulnérabilités de l'outillage de build ne
      # sont pas livrées au navigateur et leur correction impose souvent des
      # montées de version cassantes. On bloque sur ce qui atteint réellement
      # l'utilisateur. État au 2026-08-07 : 0 high/critical en production
      # (4 modérées via l'éditeur CMS, suivies mais non bloquantes).
      - name: Vulnérabilités des dépendances livrées
        run: npm audit --omit=dev --audit-level=high
